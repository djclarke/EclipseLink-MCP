name: update_order
title: Change an order's status
description: "Ship or cancel an open order. Only the status changes, with the time it shipped when shipping. The customer, date and lines of an order cannot be changed."
action: update
root: Order
set:
  status: { required: true, allowed: [SHIPPED, CANCELLED] }
  shippedAt: { description: "When it shipped, ISO-8601 with its offset. Pass it when status is SHIPPED." }
condition: { path: status, op: eq, value: OPEN }
