apiVersion: eclipselink-mcp/v1
server:
  name: order-desk
  title: Order desk (sample with writes)
  version: 0.1.0
  instructions: |
    Sample order desk. Amounts are in USD. Ship or cancel open orders, add, change or remove lines on open
    orders, and create customers or correct their email. Products are read-only here. Confirm each change with the user first.

connection:
  # The same database as samples/sales-db, through an account allowed to make only these changes.
  url: ${env:SALES_DB_URL}
  user: ${env:ORDER_DESK_DB_USER:-MCP_ORDER_DESK}
  password: ${env:ORDER_DESK_DB_PASSWORD}
  pool:
    min: 1
    max: 4

model:
  mappings: model/eclipselink-orm.xml

tools:
  # Entities that may be written and the actions allowed on each (default: none, read-only). Update and delete
  # need an optimistic lock: Order and Customer have their own version, OrderLine is locked through its order.
  # An operation in writes/ becomes a tool only when its action is listed for its entity, so reprice_product
  # stays hidden until Product is added here, and customers cannot be deleted.
  writes:
    Order: [update]
    OrderLine: [create, update, delete]
    Customer: [create, update]

limits:
  defaultPageSize: 50
  maxPageSize: 500

transport:
  type: stdio
