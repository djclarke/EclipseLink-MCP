apiVersion: eclipselink-mcp/v1
server:
  name: order-desk
  title: Order desk (sample with writes)
  version: 0.1.0
  instructions: |
    Sample order desk. Amounts are in USD. Create orders with their lines, ship or cancel open orders, and
    create customers or change their details. Lines cannot be changed once an order is placed, and products
    are read-only here. Confirm each change with the user first.

connection:
  # The same database as samples/sales-db, through an account allowed to make only these changes.
  url: ${env:SALES_DB_URL}
  user: ${env:ORDER_DESK_DB_USER:-MCP_ORDER_DESK}
  password: ${env:ORDER_DESK_DB_PASSWORD}
  pool:
    min: 1
    max: 4

model:
  mappings: model/eclipselink-orm.xml

tools:
  # Entities that may be written and the actions allowed on each (default: none, read-only). Update and delete
  # need an optimistic lock: Order and Customer have their own version. create_order creates an order's lines
  # with it, so Order: [create] covers them. OrderLine: [create] exposes add_order_line, which adds a line to
  # an open order through the order's version. An operation in writes/ becomes a tool only when its action is
  # listed for its entity: changing or removing a line and reprice_product stay hidden (existing lines are
  # immutable), and nothing can be deleted.
  writes:
    Order: [create, update]
    OrderLine: [create]
    Customer: [create, update]

limits:
  defaultPageSize: 50
  maxPageSize: 500

transport:
  type: stdio
