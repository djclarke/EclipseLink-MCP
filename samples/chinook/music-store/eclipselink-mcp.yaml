apiVersion: eclipselink-mcp/v1
server:
  name: chinook-music-store
  title: Chinook music store (sample, read-write)
  version: 0.1.0
  instructions: |
    The Chinook digital music store: artists, albums and tracks; customers and their invoices; employees;
    playlists. Amounts are in USD. Agents can sell tracks to customers (create_invoice), look after customers,
    maintain the catalog (artists, albums, tracks) and edit playlists. Invoices, employees, genres and media types
    cannot be changed here. Every change to an existing row passes back the version that was read; on CONFLICT,
    read the row again and decide with the user before trying again. Confirm each change with the user first.

connection:
  # PostgreSQL by default (samples/chinook/db/setup-postgresql.sh creates it). The tests point CHINOOK_DB_URL at
  # an H2 copy instead. mcp_store may make only the changes the write operations below make.
  url: "${env:CHINOOK_DB_URL:-jdbc:postgresql://localhost:5432/chinook}"
  user: "${env:CHINOOK_DB_USER:-mcp_store}"
  password: "${env:CHINOOK_DB_PASSWORD}"
  pool:
    min: 1
    max: 4

model:
  mappings: model/eclipselink-orm.xml

tools:
  list_entities: true
  describe_entity: true
  find_entity: true
  query_entities: true
  reports: true
  queries: true
  # Entities agents may write and the actions allowed on each. Update and delete need an optimistic lock: Artist,
  # Album, Track, Customer and Playlist have a version column, and PlaylistTrack is locked through its playlist.
  # Invoice allows only create, which needs no lock: create_invoice creates the invoice's lines with it, and an
  # issued invoice cannot change. Employee, Genre, MediaType and InvoiceLine are not listed, so they are read-only.
  writes:
    Customer: [create, update]
    Invoice: [create]
    Artist: [create, update]
    Album: [create, update]
    Track: [create, update]
    Playlist: [create, update, delete]
    PlaylistTrack: [create, delete]

limits:
  defaultPageSize: 50
  maxPageSize: 500
  maxDepth: 2
  queryTimeoutSeconds: 30

transport:
  type: stdio

logging:
  level: info
  audit: true
