name: sales_by_genre
title: Sales by genre
description: "Copies sold and invoice lines per track genre for a date range, best selling first."
root: InvoiceLine
select:
  - { path: track.genre.name, as: genre }
  - { aggregate: sum, path: quantity, as: copiesSold }
  - { aggregate: count, path: id, as: lineCount }
filter:
  and:
    - { path: invoice.invoiceDate, op: ge, param: fromDate }
    - { path: invoice.invoiceDate, op: lt, param: toDate }
groupBy: [track.genre.name]
orderBy:
  - { by: copiesSold, dir: desc }
parameters:
  fromDate: { type: timestamp, required: true, description: "Start, inclusive (e.g. 2025-01-01T00:00:00)" }
  toDate:   { type: timestamp, required: true, description: "End, exclusive (e.g. 2026-01-01T00:00:00)" }
