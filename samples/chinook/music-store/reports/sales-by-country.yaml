name: sales_by_country
title: Sales by country
description: "Invoice count and total sales (USD) per billing country for a date range, largest first."
root: Invoice
select:
  - { path: billingCountry, as: country }
  - { aggregate: count, path: id, as: invoiceCount }
  - { aggregate: sum, path: total, as: totalSales }
filter:
  and:
    - { path: invoiceDate, op: ge, param: fromDate }
    - { path: invoiceDate, op: lt, param: toDate }
groupBy: [billingCountry]
orderBy:
  - { by: totalSales, dir: desc }
parameters:
  fromDate: { type: timestamp, required: true, description: "Start, inclusive (YYYY-MM-DDTHH:MM:SS, e.g. 2025-01-01T00:00:00)" }
  toDate:   { type: timestamp, required: true, description: "End, exclusive (e.g. 2026-01-01T00:00:00)" }
