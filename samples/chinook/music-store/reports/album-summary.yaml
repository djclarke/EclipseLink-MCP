name: album_summary
title: Album summary
description: "Per album: number of tracks, total and average length (milliseconds) and total size (bytes), most tracks first. Optionally for one genre."
root: Track
select:
  - { path: album.id, as: albumId }
  - { path: album.title, as: title }
  - { path: album.artist.name, as: artist }
  - { aggregate: count, path: id, as: trackCount }
  - { aggregate: sum, path: milliseconds, as: totalMilliseconds }
  - { aggregate: avg, path: milliseconds, as: averageMilliseconds }
  - { aggregate: sum, path: bytes, as: totalBytes }
filter:
  and:
    - { path: genre.name, op: eq, param: genre }
groupBy: [album.id, album.title, album.artist.name]
orderBy:
  - { by: trackCount, dir: desc }
  - { by: title, dir: asc }
parameters:
  genre: { type: string, description: "Only tracks of this genre, e.g. Rock (default: all)" }
