name: best_selling_artists
title: Best-selling artists
description: "Copies sold per artist for a date range, optionally one genre, best selling first. Use pageSize for a top N. report_top_artists counts tracks in the catalog; this counts what customers bought."
root: InvoiceLine
select:
  - { path: track.album.artist.id, as: artistId }
  - { path: track.album.artist.name, as: artist }
  - { aggregate: sum, path: quantity, as: copiesSold }
filter:
  and:
    - { path: invoice.invoiceDate, op: ge, param: fromDate }
    - { path: invoice.invoiceDate, op: lt, param: toDate }
    - { path: track.genre.name, op: eq, param: genre }
groupBy: [track.album.artist.id, track.album.artist.name]
orderBy:
  - { by: copiesSold, dir: desc }
  - { by: artist, dir: asc }
parameters:
  fromDate: { type: timestamp, required: true, description: "Start, inclusive (e.g. 2025-01-01T00:00:00)" }
  toDate:   { type: timestamp, required: true, description: "End, exclusive (e.g. 2026-01-01T00:00:00)" }
  genre:    { type: string, description: "Only tracks of this genre, e.g. Rock (default: all)" }
