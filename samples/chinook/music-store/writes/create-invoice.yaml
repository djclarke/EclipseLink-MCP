name: create_invoice
title: Sell tracks to a customer
description: "Record a purchase: an invoice for a customer with one line per track bought, all in one call. The database assigns the ids. The invoice is dated now, billed to the customer's current address, and each line keeps the track's current price. Invoices cannot be changed afterwards."
action: create
root: Invoice
set:
  customer: { required: true, description: "The customer buying the tracks" }
fixed:
  invoiceDate: $now                 # the server's clock when the invoice is created
copy:                               # a snapshot: a later change of address does not alter the invoice
  billingAddress: customer.address
  billingCity: customer.city
  billingState: customer.state
  billingCountry: customer.country
  billingPostalCode: customer.postalCode
items:
  lines:                            # Invoice.lines: each line is created with the invoice
    min: 1
    set:
      track: { required: true }
      quantity: { required: true, description: "Copies, usually 1" }
    copy:
      unitPrice: track.unitPrice    # the price the track sells at now
    sum:
      total: [quantity, unitPrice]  # the invoice total is the sum of quantity x unit price over its lines
