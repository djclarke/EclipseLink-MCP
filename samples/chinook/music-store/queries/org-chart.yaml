name: org_chart
title: Employees and who they report to
description: "Employees with a given title pattern, each with their manager, their direct reports and the customers they support."
root: Employee
filter:
  and:
    - { path: title, op: like, param: title }
orderBy: [{ by: lastName, dir: asc }]
parameters:
  title: { type: string, required: true, description: "Job title or SQL LIKE pattern: '%' for everyone, 'Sales%'" }
graph:
  - firstName
  - lastName
  - title
  - reportsTo.firstName
  - reportsTo.lastName
  - directReports.firstName
  - directReports.lastName
  - customers.firstName
  - customers.lastName
  - customers.country
