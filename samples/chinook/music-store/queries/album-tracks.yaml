name: album_tracks
title: Albums with their tracks
description: "Albums by artists whose name matches a pattern, each with its artist and its tracks (genre, media type, length and price)."
root: Album
filter:
  and:
    - { path: artist.name, op: like, param: artist }
orderBy: [{ by: title, dir: asc }]
parameters:
  artist: { type: string, required: true, description: "Artist name or SQL LIKE pattern: 'AC/DC', 'Led%', '%Orchestra%'" }
graph:
  - title
  - artist.name
  - tracks.name
  - tracks.composer
  - tracks.milliseconds
  - tracks.unitPrice
  - tracks.genre.name
  - tracks.mediaType.name
