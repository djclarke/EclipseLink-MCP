# The 20 of AdventureWorks' 68 tables both definitions are built from: sales orders and their lines,
# customers and stores, sales people and territories, the product catalogue with its price history, and
# the people and addresses orders refer to. init --selection selection.yaml generates the starting model.
schemas: [sales, production, purchasing, person]
tables:
  - sales.salesorderheader
  - sales.salesorderdetail
  - sales.customer
  - sales.store
  - sales.salesperson
  - sales.salespersonquotahistory
  - sales.salesterritory
  - sales.specialoffer
  - production.product
  - production.productsubcategory
  - production.productcategory
  - production.productlistpricehistory
  - purchasing.shipmethod
  - person.person
  - person.businessentity
  - person.businessentityaddress
  - person.address
  - person.addresstype
  - person.stateprovince
  - person.emailaddress
# A line's declared key is (salesorderid, salesorderdetailid); the second is an identity column that is
# unique on its own, so the database assigns a new line's key.
keys: { sales.salesorderdetail: [salesorderdetailid] }
# Sales orders keep their revision number as the optimistic lock version. emailaddress.version (added by
# db/overlay.sql) is found by its name.
versions: { sales.salesorderheader: revisionnumber }
