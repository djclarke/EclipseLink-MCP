# PostgreSQL with the AdventureWorks sample database. From this folder:
#   docker compose up -d                    # build (first time, about a minute) and start
#   docker compose up -d --force-recreate   # reset the data
services:
  db:
    build: db
    image: eclipselink-mcp/adventureworks-db:0.1.0
    ports:
      - "5432:5432"
