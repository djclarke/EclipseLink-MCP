apiVersion: eclipselink-mcp/v1
server:
  name: adventureworks-order-entry
  title: AdventureWorks order entry
  version: 0.1.0
  instructions: |
    AdventureWorks Cycles order entry. Place sales orders for store customers, add lines to orders that are
    still in process, approve, ship or cancel them, and correct a person's email address. Amounts are in USD.
    Order status is a number: 1 in process, 2 approved, 3 backordered, 4 rejected, 5 shipped, 6 cancelled.
    Lines cannot be changed once added, and products are read-only here. Find a customer's addresses with
    query_customer_addresses before placing an order. Confirm each change with the user first.

connection:
  url: ${env:AW_DB_URL:-jdbc:postgresql://localhost:5432/adventureworks}
  user: ${env:AW_ORDER_ENTRY_DB_USER:-mcp_order_entry}
  password: ${env:AW_ORDER_ENTRY_PASSWORD}
  drivers: ../drivers               # the PostgreSQL JDBC driver; see ../README.md
  pool:
    min: 1
    max: 4

model:
  mappings: model/eclipselink-orm.xml

tools:
  # Entities that may be written and the actions allowed on each (default: none, read-only). Sales orders
  # are locked by their revision number. A line is locked through its order, so SalesOrderDetail: [create]
  # exposes add_order_line and existing lines stay as they are. EmailAddress has its own version.
  writes:
    SalesOrderHeader: [create, update]
    SalesOrderDetail: [create]
    EmailAddress: [update]

limits:
  defaultPageSize: 50
  maxPageSize: 500

transport:
  type: stdio
