apiVersion: eclipselink-mcp/v1
server:
  name: adventureworks
  title: AdventureWorks sales
  version: 0.1.0
  instructions: |
    AdventureWorks Cycles, a bicycle and parts wholesaler: sales orders with their lines, customers and
    stores, sales people and territories, and the product catalogue with its list price history. Amounts
    are in USD. Order status is a number: 1 in process, 2 approved, 3 backordered, 4 rejected, 5 shipped,
    6 cancelled. Historical orders run from 2022 to mid-2025. If write tools are available, they place
    orders for store customers, add lines to orders still in process, approve, ship or cancel orders, and
    correct an email address; lines cannot be changed once added, and products are read-only. Find a
    customer's addresses with query_customer_addresses before placing an order. Confirm each change with
    the user first.

connection:
  # One account for every caller. Who may change data is decided per caller, by the write scope on their
  # token over HTTP, or by --writes on stdio (see ../README.md); the account limits what any write can touch.
  url: ${env:AW_DB_URL:-jdbc:postgresql://localhost:5432/adventureworks}
  user: ${env:AW_DB_USER:-mcp_adventureworks}
  password: ${env:AW_DB_PASSWORD}
  drivers: ../drivers               # the PostgreSQL JDBC driver; see ../README.md
  pool:
    min: 1
    max: 4

model:
  mappings: model/eclipselink-orm.xml

tools:
  # The most any caller can do: entities that may be written and the actions allowed on each. Sales orders
  # are locked by their revision number. A line is locked through its order, so SalesOrderDetail: [create]
  # exposes add_order_line and existing lines stay as they are. EmailAddress has its own version.
  writes:
    SalesOrderHeader: [create, update]
    SalesOrderDetail: [create]
    EmailAddress: [update]

limits:
  defaultPageSize: 50
  maxPageSize: 500

transport:
  type: stdio
