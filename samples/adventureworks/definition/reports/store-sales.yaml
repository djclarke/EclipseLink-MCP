name: store_sales
title: Sales per store
description: "Store (reseller) orders per store and its sales person for a date range in one territory, largest total first. Compare two ranges to see which stores ordered less or stopped ordering. Excludes cancelled orders."
root: SalesOrderHeader
select:
  - path: customer.store.name
    as: store
  - path: customer.customerId
    as: customerId
  - path: salesPerson.businessEntityId
    as: salesPersonId
  - aggregate: count
    path: salesOrderId
    as: orderCount
  - aggregate: sum
    path: totalDue
    as: totalDue
filter:
  and:
    - { path: orderDate, op: ge, param: fromDate }
    - { path: orderDate, op: lt, param: toDate }
    - { path: status, op: ne, value: 6 }
    - { path: onlineOrderFlag, op: eq, value: false }
    - { path: territory.name, op: eq, param: territory }
groupBy: [customer.store.name, customer.customerId, salesPerson.businessEntityId]
orderBy:
  - { by: totalDue, dir: desc }
parameters:
  fromDate:  { type: timestamp, required: true, description: "Start of the range, inclusive (YYYY-MM-DDTHH:MM:SS)" }
  toDate:    { type: timestamp, required: true, description: "End of the range, exclusive (YYYY-MM-DDTHH:MM:SS)" }
  territory: { type: string, required: true, description: "Territory name, such as France" }
