name: sales_by_channel
title: Sales by channel
description: "Orders and total due split between online orders (onlineOrderFlag true: individual customers on the web) and store orders placed through a sales person (false), for a date range, optionally one territory. Excludes cancelled orders."
root: SalesOrderHeader
select:
  - path: onlineOrderFlag
    as: online
  - aggregate: count
    path: salesOrderId
    as: orderCount
  - aggregate: sum
    path: totalDue
    as: totalDue
filter:
  and:
    - { path: orderDate, op: ge, param: fromDate }
    - { path: orderDate, op: lt, param: toDate }
    - { path: status, op: ne, value: 6 }
    - { path: territory.name, op: eq, param: territory }   # dropped when not given
groupBy: [onlineOrderFlag]
orderBy:
  - { by: totalDue, dir: desc }
parameters:
  fromDate:  { type: timestamp, required: true, description: "Start of the range, inclusive (YYYY-MM-DDTHH:MM:SS)" }
  toDate:    { type: timestamp, required: true, description: "End of the range, exclusive (YYYY-MM-DDTHH:MM:SS)" }
  territory: { type: string, description: "Territory name, such as France (default: all territories)" }
