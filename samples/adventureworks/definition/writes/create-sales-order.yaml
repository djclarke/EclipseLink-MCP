name: create_sales_order
title: Place a sales order
description: "Place a new sales order for a customer, with all of its lines in the same call. The database assigns the order and line ids. The order starts in process (status 1) at revision 1, dated now. Each line is sold at the product's current list price with no discount; tax and freight are zero, so the total due is the sum of the lines."
action: create
root: SalesOrderHeader
set:
  customer: { required: true, description: "The customer the order is for (customerId)" }
  billToAddress: { required: true, description: "One of the customer's addresses (query_customer_addresses)" }
  shipToAddress: { required: true, description: "One of the customer's addresses (query_customer_addresses)" }
  shipMethod: { required: true, description: "How the order ships (shipMethodId; 5 is CARGO TRANSPORT 5)" }
  dueDate: { required: true, description: "When the order is due, as a local date-time, e.g. 2026-12-08T00:00:00" }
  salesPerson: { description: "The sales person for the order (businessEntityId), usually the store's" }
  territory: { description: "The sales territory (territoryId), usually the customer's" }
  purchaseOrderNumber: { description: "The customer's purchase order number" }
  comment: { description: "A note on the order" }
fixed:
  status: 1                         # in process
  orderDate: $now
  onlineOrderFlag: false
  taxAmt: 0
  freight: 0
  modifiedDate: $now
items:
  lines:                            # SalesOrderHeader.lines: each line is created with the order
    min: 1
    set:
      product: { required: true, description: "The product sold (productId)" }
      orderQty: { required: true, description: "Units, 1 or more" }
    fixed:
      specialOffer: 1               # No Discount
      unitPriceDiscount: 0
      modifiedDate: $now
    copy:                           # a snapshot: a later price change does not alter the line
      unitPrice: product.listPrice
    sum:
      subTotal: [orderQty, unitPrice]
      totalDue: [orderQty, unitPrice]
