name: open_orders
title: Open sales orders
description: "Orders still in process (status 1) or approved (2), newest first, with their customer's store and their lines. Each order carries the revisionNumber that write tools need."
root: SalesOrderHeader
filter:
  and:
    - { path: status, op: in, value: [1, 2] }
    - { path: customer.customerId, op: eq, param: customerId }   # dropped when not given
orderBy: [{ by: orderDate, dir: desc }]
parameters:
  customerId: { type: integer, description: "Only this customer's orders (default: all)" }
graph: [orderDate, dueDate, status, subTotal, totalDue, revisionNumber, customer.store.name,
        lines.orderQty, lines.unitPrice, lines.product.name]
