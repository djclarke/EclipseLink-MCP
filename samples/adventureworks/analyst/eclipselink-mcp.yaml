apiVersion: eclipselink-mcp/v1
server:
  name: adventureworks-analyst
  title: AdventureWorks sales analyst (read-only)
  version: 0.1.0
  instructions: |
    AdventureWorks Cycles, a bicycle and parts wholesaler: sales orders with their lines, customers and
    stores, sales people and territories, and the product catalogue with its list price history. Amounts
    are in USD. Order status is a number: 1 in process, 2 approved, 3 backordered, 4 rejected, 5 shipped,
    6 cancelled. Historical orders run from 2022 to mid-2025. Read-only: nothing can be changed here.

connection:
  url: ${env:AW_DB_URL:-jdbc:postgresql://localhost:5432/adventureworks}
  user: ${env:AW_DB_USER:-mcp_reader}
  password: ${env:AW_READER_PASSWORD}
  drivers: ../drivers               # the PostgreSQL JDBC driver; see ../README.md
  pool:
    min: 1
    max: 4

model:
  mappings: model/eclipselink-orm.xml

limits:
  defaultPageSize: 50
  maxPageSize: 500

transport:
  type: stdio
