name: top_products
title: Best-selling products
description: Units sold and number of order lines per product for orders placed in a date range, most units first.
root: SalesOrderDetail
select:
  - path: product.name
    as: product
  - path: product.productSubcategory.productCategory.name
    as: category
  - aggregate: sum
    path: orderQty
    as: units
  - aggregate: count
    path: salesOrderDetailId
    as: lines
filter:
  and:
    - { path: salesOrder.orderDate, op: ge, param: fromDate }
    - { path: salesOrder.orderDate, op: lt, param: toDate }
    - { path: salesOrder.status, op: ne, value: 6 }
groupBy: [product.name, product.productSubcategory.productCategory.name]
orderBy:
  - { by: units, dir: desc }
parameters:
  fromDate: { type: timestamp, required: true, description: "Start of the range, inclusive (YYYY-MM-DDTHH:MM:SS)" }
  toDate:   { type: timestamp, required: true, description: "End of the range, exclusive (YYYY-MM-DDTHH:MM:SS)" }
