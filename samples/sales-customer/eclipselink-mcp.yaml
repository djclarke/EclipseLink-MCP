apiVersion: eclipselink-mcp/v1
server:
  name: sales-customer
  title: Sales (customer email updates, sample)
  version: 0.1.0
  instructions: |
    Sample sales data. Amounts are in USD. Read customers, orders, order lines and products. The only changes
    allowed are creating a customer and correcting a customer's email, checked against the customer's version. Confirm each change
    with the user first.

connection:
  # The same database as samples/sales-db, through the sample account that may update CUSTOMER.
  url: ${env:SALES_DB_URL}
  user: ${env:ORDER_DESK_DB_USER:-MCP_ORDER_DESK}
  password: ${env:ORDER_DESK_DB_PASSWORD}

model:
  mappings: model/eclipselink-orm.xml

tools:
  # Only Customer may be written: created and updated, never deleted. init mapped its VERSION column as the
  # optimistic lock that updates check.
  writes:
    Customer: [create, update]
